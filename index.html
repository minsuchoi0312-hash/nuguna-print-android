<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17171C" />
    <title>누구나프린트</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 글꼴은 앱 안에 넣어 둔다(@fontsource) — 외부 서버(Google Fonts)로 아무것도 보내지 않으려고 -->
    <script>
      try {
        var t = localStorage.getItem("atlas-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        var c = t === "light" ? "#F2F4F6" : "#17171C";
        document.querySelectorAll("meta[name=theme-color]").forEach(function (m) { m.setAttribute("content", c); });
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/android-main.tsx"></script>
  </body>
</html>
